# Fact-checker feeds (RSS/Atom). One block per fact-checker. ADD A LINE HERE to cover a new country:
# no code change needed. `verified: false` = address not yet tested; every run writes
# reports/desinfo_sources.md saying which feeds worked, so wrong addresses show up by themselves.
# country = ISO2 code of the country the fact-checker works in (or "" for international); lang = ISO 639-1.
# Only recognised fact-checkers (IFCN signatories, EDMO, Duke Reporters' Lab). No judgement of our own.
feeds:
