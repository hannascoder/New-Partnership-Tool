# UN content for the "Do we already have something?" check (disinformation monitor, content gaps).
# Public news feeds of the UN and its agencies. One block per feed. If `url` does not work, the run looks for the
# feed that the site announces on its home page (`site`). Every run reports which sources worked in
# reports/desinfo_sources.md; correct or add lines here, no code change needed.
# lang = language of the feed (the gap check looks at languages), agency = name shown on the page.
feeds:
