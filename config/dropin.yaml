# ============================================================================
# "Start from a UN text" (owner's request 16.11.2026).
# Someone pastes a UN mail (e.g. a "UN VIDEO UPDATE"), a press release or a
# story into the box above the results. The website reads country, topics,
# format and language from the text and sets the normal filters. Everything
# happens in the browser: the text is not stored or sent anywhere.
#
# No AI service is used. The text is compared with
#   - the country names and everyday names in countries.csv, plus `places` below
#   - the topic keywords in topic_keywords.yaml ("strong" and "context" words,
#     all 9 languages), plus `extra_topic_words` below
#   - `formats` and `language_words` below
# pipeline/build/dropin.py writes all of this to site/data/dropin.json.
# ============================================================================

# ---- how many suggestions -------------------------------------------------
max_topics: 3          # at most this many topic buttons are switched on
min_topic_score: 2     # a strong word = 2 points, a context word = 1, in the headline = double
topic_share: 0.4       # a topic needs at least this share of the best topic's points
max_countries: 3
country_share: 0.34    # a country needs at least this share of the best country's points
                       # (so "funded by Germany" in a story about Lebanon does not add Germany)
# Which list the suggestions show (tested 16.11.2026 with a mail about Lebanon):
#   media: few general news outlets have a topic, so with "only matches" a country
#          gives 2-3 outlets. Therefore: all outlets of the country that can use the
#          format, those that work on the topic first (weak matches count).
#   ngo:   only the organisations that work on the topic (enough of them have one).
only_matches: {media: false, ngo: true}
weak_matches: {media: true, ngo: false}
apply_language: false  # false: the language is shown as a suggestion, one click adds it
                       # (a video with English subtitles is also useful for other audiences)

# ---- parts of a mail that say nothing about its subject --------------------
# Lines that contain one of these are ignored (letterhead, footer, contact line).
skip_lines:
  - "UN VIDEO UPDATE"
  - "Contact:"
  - "Download the video"
  - "Translations are AI-generated"
  - "UN Video creates content"
  - "Videos must be published in full"
  - "Point of Contact"
  - "United Nations Video Section"
  - "Department of Global Communications"
  - "News and Media Division"
  - "youtube.com/"
  - "Unsubscribe"
  - "For more information"
# Everything after such a line is read only for format and language
# (in a UN Video mail: NEWS ["English Subtitles"] ["None"] Square 01:08).
technical_markers:
  - "TECHNICAL DETAILS"
# Expressions in which a country name means something else; removed before matching.
ignore_phrases:
  - "US$"
  - "Indian Ocean"
  - "New Mexico"
  - "Guinea worm"
  - "Gulf of Guinea"
  - "Gulf of Mexico"
  - "Jordan River"
  - "River Jordan"
  - "Lake Chad"
  - "Panama Canal"
  - "Turkey meat"

# ---- format -----------------------------------------------------------------
# button under "Format & channel" -> words that show the material is of this kind
formats:
  video: [video, videos, footage, b-roll, broll, unifeed, subtitles, mp4]
  audio: [audio, podcast, radio feature, soundbite, soundbites, mp3]
  photo: [photo, photos, photo essay, photo gallery, photographs]
  graphic: [infographic, infographics, social media card, social media cards, data visualisation, data visualization]
  text: [press release, op-ed, feature story, news story, statement attributable]
# shown next to the format as extra information (no filter yet; see the owner's
# to-do "video format")
shapes: [Square, Vertical, Horizontal, Landscape, Portrait, "16:9", "9:16", "1:1"]
# a language counts when its English name stands directly before or after one of these
language_words: [subtitles, subtitled, subtitle, version, narration, voice-over, voiceover, audio, dubbed, captions, language]

# ---- extra topic words --------------------------------------------------------
# Words typical for UN texts that are too general for classifying outlets
# (topic_keywords.yaml) but clear in a UN mail. They count like strong words.
extra_topic_words:
  conflict_security: [peacekeeper, peace operation, peace operations, peacekeeping mission, unifil, minusca, undof, unficyp, hostilities, shelling, cessation of hostilities, blue line]
  humanitarian: [humanitarian response, aid convoy, aid convoys, life-saving, lifesaving]
  migration: [returnees, displaced, forcibly displaced]
  climate: [cop30, cop31, cop32, unfccc, climate summit]
  health: [who chief, world health organization, outbreak, vaccination campaign]
  hunger_food: [food insecurity, world food programme, acute hunger, ipc]
  children_youth: [unicef, schoolchildren]
  gender_equality: [un women, women and girls]
  human_rights: [ohchr, human rights council, high commissioner for human rights, rights office]
  disasters: [earthquake, cyclone, hurricane, floods, flooding, typhoon, drought]

# ---- places -------------------------------------------------------------------
# Extra names that point to a country, besides its name and everyday names in
# countries.csv: adjective ("Lebanese"), capital, well-known regions and cities,
# UN missions. Names in CAPITALS (UNIFIL, DRC) must be written like that in the
# text; all others are found in any spelling of upper and lower case.
# Left out on purpose because they mean other things too: Male, Victoria,
# Kingston, Georgetown, Santiago, San José, Indian, Korean, Guinean, American,
# and the adjectives that are also UN languages (French, Spanish, Portuguese,
# Russian, Chinese: "with French subtitles"). Congolese is added to DR Congo only.
# Jerusalem is not assigned to a country (East Jerusalem: State of Palestine, as the UN does).
