# ============================================================================
# Classification rules (briefing K4, docs/KATEGORIEN.md).
# Read by pipeline/classify/classify.py. Every value an outlet gets stores
# WHY (method + source), shown on the website as a tooltip.
#
# Names of Wikidata classes are the English labels as Wikidata writes them.
# Network ids are the lists in config/sources/networks.yaml.
# Hand corrections in overrides.csv always win over these rules.
# ============================================================================

# ---------------------------------------------------------------- 4a
# Organisation type: exactly ONE per outlet. Checked top to bottom, the first
# type with evidence wins (decision 2 of 05.11.2026). No evidence -> news_outlet.
org_type:
  - type: fact_checker
    # Wikidata class counts only when the outlet is not also a news agency /
    # broadcaster / newspaper (Wikidata marks AFP, DW and dpa as fact-checkers too).
    wikidata_classes_if_no_media_class: [fact-checking organisation]
    # Membership of a fact-checking network alone is not enough when the
    # outlet is also a newspaper, broadcaster or news agency (AFP, DW, India
    # Today run fact-checking units): those keep their own type and get the
    # topic "Fact-checking" and the UN profile instead.
    networks_if_no_media_class: [efcsn_signatories, ifcn_signatories, fact_checking_sites]
  - type: news_agency
    wikidata_classes: [news agency]
    # ... unless the outlet is also a broadcaster (Wikidata lists Deutsche Welle
    # as a news agency too): broadcasters are checked by the next rule.
    unless_wikidata_classes: [public broadcaster, broadcaster, television station, radio station,
                              international broadcasting, television channel]
    networks_if_no_media_class: [news_agencies]
  - type: public_service_broadcaster
    wikidata_classes: [public broadcaster, German public state broadcaster, public radio station,
                       public broadcasting, public television, public service broadcaster]
    # EBU full/associate members are public service media by EBU statute;
    # ASBU full members are the national broadcasters of the Arab states.
    # (ABU and CBU also admit commercial broadcasters: not used for this type.)
    # Whether such a broadcaster is "state-controlled" instead is decided in
    # step 4b (ownership); it then stays a broadcaster but not public service.
    # Only FULL members count (EBU associate members include commercial and
    # non-European broadcasters).
    networks_full_members: [ebu_members, asbu_members]
  - type: community_media
    wikidata_classes: [community radio, community newspaper, campus radio, community television,
                       student newspaper, school newspaper]
    # Radio Browser tags are typed freely by users: they count only when the
    # outlet is also confirmed by a second source.
    radio_browser_tags_with_second_source: [community radio, radio comunitaria, comunitaria,
                                            concesión comunitaria, radio communautaire,
                                            university radio, college radio, radio universitaria,
                                            campus radio, student radio]
  - type: news_outlet
    default: true

# Wikidata classes that make an outlet a "media outlet" for the rule above
# (a fact-checking or agency network membership alone does not change its type).
media_classes: [newspaper, daily newspaper, weekly newspaper, magazine, news magazine, online newspaper,
                news website, television station, television channel, radio station, broadcaster,
                public broadcaster, news agency, international broadcasting, specialty channel,
                television network, broadcast network, radio network]

# ---------------------------------------------------------------- 4b
# Ownership: exactly ONE value, always with its source (briefing G).
# Checked top to bottom; the first rule with evidence wins. No evidence -> unknown.
# "owner" = the outlet's owner or parent organisation in Wikidata (P127/P749),
# and also the owner's own owner (one level up). Classes are Wikidata labels.
ownership:
  - value: state_controlled
    # 1. The Wikipedia "List of state media by country", whose main source is
    #    the State Media Monitor (Media and Journalism Research Center): it lists
    #    state-controlled media only (not independent public media like BBC or ARD).
    networks: [state_media]
    # Rules 2 and 3 do NOT apply to public broadcasters (step 4a type
    # "public service broadcaster"): Wikidata often names a ministry as the formal
    # owner of independent public media (BBC -> culture ministry) or calls them
    # "state media" (DW). For them only rule 1 (State Media Monitor) decides.
    # 2. The outlet itself is run as a government body (Wikidata).
    #    NOT counted (owner's principle 06.11.2026): "state media" / "state-owned
    #    enterprise" in Wikidata alone - state-OWNED is not state-CONTROLLED
    #    (France 24, TV5 Monde). Only the State Media Monitor judges that.
    wikidata_classes: [government agency, government organization]
    # 3. Its owner is a government body, a state, a ruling party or the military.
    #    (a state-owned company or "the state" as owner is not enough, see above)
    owner_classes: [government, government agency, government organization, ministry, ministry of information,
                    executive branch, political party, communist party, armed forces, military, military branch]
    # (Until 06.11.2026 a 4th rule made public broadcasters in countries RSF
    #  rates "very serious" state-controlled. Dropped on the owner's decision:
    #  RSF rates countries, not outlets. Press freedom is now shown as country
    #  context on every card, taken from the Atlas.)
  - value: public_service
    # A public service broadcaster (step 4a) that is not state-controlled.
    org_types: [public_service_broadcaster]
    owner_classes: [public broadcaster, public service broadcaster, public broadcasting]
  - value: community_nonprofit
    org_types: [community_media]
    owner_classes: [foundation, charitable organization, nonprofit organization, non-profit organization,
                    non-governmental organization, association, voluntary association, cooperative,
                    trust, religious organization, church, diocese, university, public university,
                    private university, educational institution, community radio]
  - value: private
    owner_classes: [business, enterprise, company, public company, private company, media company,
                    privately held company, media conglomerate, publishing house,
                    conglomerate, holding company, publishing company, newspaper publisher,
                    broadcasting company, television company, human, family business, subsidiary,
                    limited company, joint-stock company, société anonyme, Aktiengesellschaft,
                    Gesellschaft mit beschränkter Haftung, corporation, mass media company]
  - value: unknown
    default: true

# A public service broadcaster (4a) whose owner is private (e.g. ITV, TV 2 Norway:
# commercial EBU members with a public service remit) is listed under BOTH
# types: "Public service broadcaster" and "News outlet" (owner's request, 06.11.2026).
also_news_outlet_if_private_psb: true

# ---------------------------------------------------------------- 4c
# Scope: exactly ONE value. The widest scope with evidence wins
# (international > regional > national > local). No evidence -> unknown.
# Reach (audience countries): home country + every country with evidence,
# each with its basis (home_country, language_service, broadcast_area, manual).
scope:
  # config/international_broadcasters.yaml (language services) -> international
  # iptv-org broadcast areas: worldwide or 2+ regions -> international;
  #   one region or 2+ countries -> regional; the home country -> national;
  #   a city or subdivision -> local
  # Media Cloud collections: "<Country> - National" -> national, "... - State & Local" -> local
  wikidata_classes:
    international: [international broadcasting]
    local: [local newspaper, local radio station, local TV channel, community newspaper, regional weekly,
            community radio, campus radio, student newspaper, school newspaper, local television station]
  # Community media without other evidence are local
  org_types:
    local: [community_media]

# ---------------------------------------------------------------- 4d
# Topics: SEVERAL per outlet. Topics never hide an outlet, they only change
# the order (briefing H, L). Every topic stores where it comes from.
# Evidence, strongest first (briefing K4):
#   source_field  the source's own categories/tags/subjects, mapped in
#                 config/sources/iptv_org.yaml, radio_browser.yaml, wikidata.yaml (topics:)
#   membership    member of a network list (below)
#   rule          organisation type / scope (below)
#   keyword       a clear word in the outlet's NAME (below)
#   default       "general_news" when nothing else is known
topics:
  networks:
    fact_checking: [ifcn_signatories, efcsn_signatories, fact_checking_sites]
    peace_justice: [occrp_network]     # OCCRP: investigative media on corruption and organised crime
    media_freedom: [occrp_network]
    climate: [covering_climate_now]          # as soon as the CSV snapshot is in raw/manual/
  org_types:
    fact_checking: [fact_checker]
    community_local: [community_media]
  scopes:
    community_local: [local]
  # Words: since 09.11.2026 all topic words (name, descriptions, Wikipedia,
  # website menu, About page, headlines) are in config/topic_keywords.yaml,
  # with the three strengths Focus / Desk / Covers.
  # A "name" that lists sections like a tagline ("Noticias, Deportes, Economía, ...")
  # is not used: those are general news sites.
  name_keywords_max_commas: 1

# UN profile: SEVERAL per outlet; like topics, only changes the order.
# "Solutions / constructive journalism", "Development journalism" and
# "Open to partner content" have NO open source yet: they stay empty until
# a list is found, hand corrections are made or the website check finds them.
un_profile:
  networks:
    un_relationship: [sdg_media_compact]        # later also the internal list (owner)
    fact_checking_ifcn: [ifcn_signatories]
  org_types:
    public_service_mandate: [public_service_broadcaster]
  # 2 or more languages (own languages + language services) -> "Multilingual"
  multilingual_min_languages: 2

# Target audience: SEVERAL per outlet; soft like topics (owner, 09.11.2026).
# From the per-source tables in config/sources/*.yaml (audience:), plus:
audience:
  org_types:
    local_communities: [community_media]
  topics:
    indigenous: [indigenous]
    diaspora_migrants: [diaspora]
    rural_farmers: [agriculture]
  # A language that is neither one of the 9 language buttons nor official in
  # the outlet's country (config/official_languages.csv) = minority language.
  minority_language: minority_language
  # Words in the outlet's name (same rules as for topics)
  name_keywords:
    women: [women, woman, women's, femmes, femme, mujer, mujeres, mulher, mulheres, ladies]
    older_persons: [seniors, senior, elderly, retirees, retired, aînés, mayores, idosos, 50plus, "50+"]
    youth_students: [youth, juvenil, jeunes, jeunesse, jóvenes, juventude, teen, teens, student, students, estudiantes,
                     étudiants, campus, college, university]
    children: [kids, children, enfants, niños, crianças, junior]
    rural_farmers: [farmer, farmers, farm, farming, rural, agricole, campesino, campesinos, agro]
    persons_with_disabilities: [deaf, blind, sign language, disability, disabilities, handicap]
    lgbtq: [lgbt, lgbtq, lgbtqi, gay, lesbian, queer]
    diaspora_migrants: [diaspora, expat, expats, immigrant, immigrants, migrants]
    business_professionals: [business, financial, finance, economic, trade]

# ---------------------------------------------------------------- exclusion
# Very right-wing (far-right) media are NOT shown (owner's request, 06.11.2026:
# "das bringt nichts"). Only open, documented evidence counts; every excluded
# outlet is listed with its reason in reports/excluded_far_right.md so the owner
# can check. A hand correction in overrides.csv (field "far_right", value "no")
# brings an outlet back.
exclude_far_right:
  # Wikidata "political ideology" (P1142) of the outlet or of its owner
  wikidata_ideologies: [far-right politics, alt-right, neo-Nazism, neo-fascism, fascism, Nazism,
                        white nationalism, white supremacy, ultranationalism, neo-Confederate,
                        identitarian movement, Great Replacement, antisemitism, Holocaust denial,
                        clerical fascism, national socialism]
  # NOT used on their own (too broad, would catch mainstream conservative media):
  # right-wing populism, conservatism, nationalism, national conservatism.
  # Wikipedia categories: every category whose title contains "far-right",
  # "alt-right", "neo-Nazi", "white nationalist" or "fascist" and a media word
  # (fetched by pipeline/fetch/far_right.py), and their direct subcategories.
  wikipedia_categories: true

# ---------------------------------------------------------------- website check
# Channels found on the outlet's own website (menu entries, feed addresses).
# Whole menu entry or a word in it; 9 UN News languages.
website_channels:
  podcast: [podcast, podcasts, balado, balados, pódcast, pódcasts, подкаст, подкасты, بودكاست, 播客, पॉडकास्ट, podikasti]
  newsletter: [newsletter, newsletters, infolettre, lettre d'information, boletín, boletim, рассылка, النشرة البريدية, न्यूज़लेटर, jarida la barua pepe]
# The page language (<html lang="fr">) is used when no source names a language.
website_language: true

# "Open to partner content" (UN profile; suggestion 1, owner's go 09.11.2026):
# the outlet's website shows it publishes content from others. Words in link texts /
# addresses on the website and in its About page. 9 UN News languages.
open_to_partner_content:
  - creativecommons.org
  - creative commons
  - republish
  - republishing
  - syndication
  - content syndication
  - submit a story
  - submit your story
  - submit news
  - submit an article
  - send us your story
  - send us your news
  - write for us
  - become a contributor
  - contributors wanted
  - pitch us
  - submit a press release
  - submit press release
  - partner with us
  - content partnership
  - content partners
  - republier
  - proposer un article
  - envoyez vos articles
  - envoyez-nous
  - devenir contributeur
  - publiez votre communiqué
  - republicar
  - envía tu nota
  - envíanos tu noticia
  - publica tu noticia
  - escribe para nosotros
  - colabora con nosotros
  - envie sua notícia
  - envie sua pauta
  - seja colaborador
  - colabore conosco
  - прислать новость
  - предложить новость
