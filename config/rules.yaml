# ============================================================================
# Classification rules (briefing K4, docs/KATEGORIEN.md).
# Read by pipeline/classify/classify.py. Every value an outlet gets stores
# WHY (method + source), shown on the website as a tooltip.
#
# Names of Wikidata classes are the English labels as Wikidata writes them.
# Network ids are the lists in config/sources/networks.yaml.
# Hand corrections in overrides.csv always win over these rules.
# ============================================================================

# ---------------------------------------------------------------- 4a
# Organisation type: exactly ONE per outlet. Checked top to bottom, the first
# type with evidence wins (decision 2 of 05.11.2026). No evidence -> news_outlet.
org_type:
  - type: fact_checker
    # Wikidata class counts only when the outlet is not also a news agency /
    # broadcaster / newspaper (Wikidata marks AFP, DW and dpa as fact-checkers too).
    wikidata_classes_if_no_media_class: [fact-checking organisation]
    # Membership of a fact-checking network alone is not enough when the
    # outlet is also a newspaper, broadcaster or news agency (AFP, DW, India
    # Today run fact-checking units): those keep their own type and get the
    # topic "Fact-checking" and the UN profile instead.
    networks_if_no_media_class: [efcsn_signatories, ifcn_signatories, fact_checking_sites]
  - type: news_agency
    wikidata_classes: [news agency]
    # ... unless the outlet is also a broadcaster (Wikidata lists Deutsche Welle
    # as a news agency too): broadcasters are checked by the next rule.
    unless_wikidata_classes: [public broadcaster, broadcaster, television station, radio station,
                              international broadcasting, television channel]
    networks_if_no_media_class: [news_agencies]
  - type: public_service_broadcaster
    wikidata_classes: [public broadcaster, German public state broadcaster, public radio station,
                       public broadcasting, public television, public service broadcaster]
    # EBU full/associate members are public service media by EBU statute;
    # ASBU full members are the national broadcasters of the Arab states.
    # (ABU and CBU also admit commercial broadcasters: not used for this type.)
    # Whether such a broadcaster is "state-controlled" instead is decided in
    # step 4b (ownership); it then stays a broadcaster but not public service.
    # Only FULL members count (EBU associate members include commercial and
    # non-European broadcasters).
    networks_full_members: [ebu_members, asbu_members]
  - type: community_media
    wikidata_classes: [community radio, community newspaper, campus radio, community television,
                       student newspaper, school newspaper]
    # Radio Browser tags are typed freely by users: they count only when the
    # outlet is also confirmed by a second source.
    radio_browser_tags_with_second_source: [community radio, radio comunitaria, comunitaria,
                                            concesión comunitaria, radio communautaire,
                                            university radio, college radio, radio universitaria,
                                            campus radio, student radio]
  - type: news_outlet
    default: true

# Wikidata classes that make an outlet a "media outlet" for the rule above
# (a fact-checking or agency network membership alone does not change its type).
media_classes: [newspaper, daily newspaper, weekly newspaper, magazine, news magazine, online newspaper,
                news website, television station, television channel, radio station, broadcaster,
                public broadcaster, news agency, international broadcasting, specialty channel,
                television network, broadcast network, radio network]

# ---------------------------------------------------------------- 4b
# Ownership: exactly ONE value, always with its source (briefing G).
# Checked top to bottom; the first rule with evidence wins. No evidence -> unknown.
# "owner" = the outlet's owner or parent organisation in Wikidata (P127/P749),
# and also the owner's own owner (one level up). Classes are Wikidata labels.
ownership:
  - value: state_controlled
    # 1. The Wikipedia "List of state media by country", whose main source is
    #    the State Media Monitor (Media and Journalism Research Center): it lists
    #    state-controlled media only (not independent public media like BBC or ARD).
    networks: [state_media]
    # Rules 2 and 3 do NOT apply to public broadcasters (step 4a type
    # "public service broadcaster"): Wikidata often names a ministry as the formal
    # owner of independent public media (BBC -> culture ministry) or calls them
    # "state media" (DW). For them only rule 1 (State Media Monitor) decides.
    # 2. The outlet itself is run as a government body (Wikidata).
    #    NOT counted (owner's principle 06.11.2026): "state media" / "state-owned
    #    enterprise" in Wikidata alone - state-OWNED is not state-CONTROLLED
    #    (France 24, TV5 Monde). Only the State Media Monitor judges that.
    wikidata_classes: [government agency, government organization]
    # 3. Its owner is a government body, a state, a ruling party or the military.
    #    (a state-owned company or "the state" as owner is not enough, see above)
    owner_classes: [government, government agency, government organization, ministry, ministry of information,
                    executive branch, political party, communist party, armed forces, military, military branch]
    # (Until 06.11.2026 a 4th rule made public broadcasters in countries RSF
    #  rates "very serious" state-controlled. Dropped on the owner's decision:
    #  RSF rates countries, not outlets. Press freedom is now shown as country
    #  context on every card, taken from the Atlas.)
  - value: public_service
    # A public service broadcaster (step 4a) that is not state-controlled.
    org_types: [public_service_broadcaster]
    owner_classes: [public broadcaster, public service broadcaster, public broadcasting]
  - value: community_nonprofit
    org_types: [community_media]
    owner_classes: [foundation, charitable organization, nonprofit organization, non-profit organization,
                    non-governmental organization, association, voluntary association, cooperative,
                    trust, religious organization, church, diocese, university, public university,
                    private university, educational institution, community radio]
  - value: private
    owner_classes: [business, enterprise, company, public company, private company, media company,
                    privately held company, media conglomerate, publishing house,
                    conglomerate, holding company, publishing company, newspaper publisher,
                    broadcasting company, television company, human, family business, subsidiary,
                    limited company, joint-stock company, société anonyme, Aktiengesellschaft,
                    Gesellschaft mit beschränkter Haftung, corporation, mass media company]
  - value: unknown
    default: true

# A public service broadcaster (4a) whose owner is private (e.g. ITV, TV 2 Norway:
# commercial EBU members with a public service remit) is listed under BOTH
# types: "Public service broadcaster" and "News outlet" (owner's request, 06.11.2026).
also_news_outlet_if_private_psb: true

# ---------------------------------------------------------------- 4c
# Scope: exactly ONE value. The widest scope with evidence wins
# (international > regional > national > local). No evidence -> unknown.
# Reach (audience countries): home country + every country with evidence,
# each with its basis (home_country, language_service, broadcast_area, manual).
scope:
  # config/international_broadcasters.yaml (language services) -> international
  # iptv-org broadcast areas: worldwide or 2+ regions -> international;
  #   one region or 2+ countries -> regional; the home country -> national;
  #   a city or subdivision -> local
  # Media Cloud collections: "<Country> - National" -> national, "... - State & Local" -> local
  # iptv-org: "regional" needs a region or at least this many countries besides the home country
  # (CNN: USA + Canada and Bild: Germany + Switzerland are national, not regional; review 13.11.2026)
  regional_min_other_countries: 2
  wikidata_classes:
    international: [international broadcasting]
    local: [local newspaper, local radio station, local TV channel, community newspaper, regional weekly,
            community radio, campus radio, student newspaper, school newspaper, local television station]
  # Community media without other evidence are local
  org_types:
    local: [community_media]

# ---------------------------------------------------------------- 4d
# Topics: SEVERAL per outlet. Topics never hide an outlet, they only change
# the order (briefing H, L). Every topic stores where it comes from.
# Evidence, strongest first (briefing K4):
#   source_field  the source's own categories/tags/subjects, mapped in
#                 config/sources/iptv_org.yaml, radio_browser.yaml, wikidata.yaml (topics:)
#   membership    member of a network list (below)
#   rule          organisation type / scope (below)
#   keyword       a clear word in the outlet's NAME (below)
#   default       "general_news" when nothing else is known
topics:
  networks:
    fact_checking: [ifcn_signatories, efcsn_signatories, fact_checking_sites]
    peace_justice: [occrp_network]     # OCCRP: investigative media on corruption and organised crime
    media_freedom: [occrp_network]
    climate: [covering_climate_now]          # as soon as the CSV snapshot is in raw/manual/
  org_types:
    fact_checking: [fact_checker]
    community_local: [community_media]
  scopes:
    community_local: [local]
  # Words: since 09.11.2026 all topic words (name, descriptions, Wikipedia,
  # website menu, About page, headlines) are in config/topic_keywords.yaml,
  # with the three strengths Focus / Desk / Covers.
  # A "name" that lists sections like a tagline ("Noticias, Deportes, Economía, ...")
  # is not used: those are general news sites.
  name_keywords_max_commas: 1
  # "Specialist" from the outlet's own texts (description, About page, Wikipedia) for more than this
  # many topics at once = a general outlet that lists its sections: those matches then count as
  # "Reports on it" (review 13.11.2026). Topics from the name, a source or a network are not touched.
  max_text_specialist: 3
  # Menu entries that are legal notices, campaigns or widgets, not sections (review 14.11.2026:
  # "Non-Discrimination" gave "Reduced inequalities", "Modern Slavery Statement" gave SDG 8).
  # A menu entry containing one of these expressions is not used.
  ignore_sections: [non discrimination, nondiscrimination, equal opportunity, eeo report, accessibility,
                    modern slavery, privacy, terms of, public file, fcc, older polls, poll results, t shirts, t shirt,
                    awareness, tornado outbreak, do not sell, cookie, advertise, subscribe, careers, jobs at]
  # A menu entry made only of words of the outlet's own name is not a section ("planet" on "planet radio").
  ignore_sections_in_own_name: true
  # Words in other languages (from Wikidata) found in more than this share of all outlets
  # are everyday words, not topic words, and are not used (0.003 = 0.3 % = ~210 outlets).
  auto_words_max_share: 0.003

# UN profile: SEVERAL per outlet; like topics, only changes the order.
# "Solutions / constructive journalism", "Development journalism" and
# "Open to partner content" have NO open source yet: they stay empty until
# a list is found, hand corrections are made or the website check finds them.
un_profile:
  networks:
    un_relationship: [sdg_media_compact]        # later also the internal list (owner)
    fact_checking_ifcn: [ifcn_signatories]
  org_types:
    public_service_mandate: [public_service_broadcaster]
  # 2 or more languages (own languages + language services) -> "Multilingual"
  multilingual_min_languages: 2

# Target audience: SEVERAL per outlet; soft like topics (owner, 09.11.2026).
# From the per-source tables in config/sources/*.yaml (audience:), plus:
audience:
  org_types:
    local_communities: [community_media]
  topics:
    indigenous: [indigenous]
    diaspora_migrants: [diaspora]
    rural_farmers: [agriculture]
  # A language that is neither one of the 9 language buttons nor official in
  # the outlet's country (config/official_languages.csv) = minority language.
  minority_language: minority_language
  # Words in the outlet's name (same rules as for topics)
  name_keywords:
    women: [women, woman, women's, femmes, femme, mujer, mujeres, mulher, mulheres, ladies]
    older_persons: [seniors, senior, elderly, retirees, retired, aînés, mayores, idosos, 50plus, "50+"]
    youth_students: [youth, juvenil, jeunes, jeunesse, jóvenes, juventude, teen, teens, student, students, estudiantes,
                     étudiants, campus, college, university]
    children: [kids, children, enfants, niños, crianças, junior]
    rural_farmers: [farmer, farmers, farm, farming, rural, agricole, campesino, campesinos, agro]
    persons_with_disabilities: [deaf, blind, sign language, disability, disabilities, handicap]
    lgbtq: [lgbt, lgbtq, lgbtqi, gay, lesbian, queer]
    diaspora_migrants: [diaspora, expat, expats, immigrant, immigrants, migrants]
    business_professionals: [business, financial, finance, economic, trade]

# ---------------------------------------------------------------- exclusion
# Very right-wing (far-right) media are NOT shown (owner's request, 06.11.2026:
# "das bringt nichts"). Only open, documented evidence counts; every excluded
# outlet is listed with its reason in reports/excluded_far_right.md so the owner
# can check. A hand correction in overrides.csv (field "far_right", value "no")
# brings an outlet back.
exclude_far_right:
  # Wikidata "political ideology" (P1142) of the outlet or of its owner
  wikidata_ideologies: [far-right politics, alt-right, neo-Nazism, neo-fascism, fascism, Nazism,
                        white nationalism, white supremacy, ultranationalism, neo-Confederate,
                        identitarian movement, Great Replacement, antisemitism, Holocaust denial,
                        clerical fascism, national socialism]
  # NOT used on their own (too broad, would catch mainstream conservative media):
  # right-wing populism, conservatism, nationalism, national conservatism.
  # Wikipedia categories: every category whose title contains "far-right",
  # "alt-right", "neo-Nazi", "white nationalist" or "fascist" and a media word
  # (fetched by pipeline/fetch/far_right.py), and their direct subcategories.
  wikipedia_categories: true
  # 3. AI reading of the Wikipedia text (cache/ai_classification.json, "far_right"): outlets described
  #    as far-right / extreme right, or like Junge Freiheit (owner, 10.11.2026: "ausblenden, und rechte
  #    Medien wie Junge Freiheit auch").
  ai_reading: true
  # Right-wing populist / party-aligned right-wing media ("right_populist" in the AI reading, e.g. GB News,
  # Republic TV, Die Weltwoche): listed in reports/excluded_far_right.md; hidden only if set to true.
  hide_right_wing_populist: true

# ---------------------------------------------------------------- website texts
# When the texts of a website are NOT used for topics, audiences and UN profiles (review 14.11.2026).
website_texts:
  # platforms many outlets only have a page on: their menu says nothing about the single outlet
  ignore_hosts: [pluto.tv, zeno.fm, tunein.com, facebook.com, youtube.com, twitter.com, x.com, instagram.com,
                 substack.com, blogspot.com, wordpress.com, wix.com, weebly.com, iheart.com, radio.net,
                 chroniclingamerica.loc.gov, archive.org, wikipedia.org]
  # ... and every website that this many outlets or more give as their own
  ignore_hosts_shared_by: 100
  # Signs that a website no longer belongs to the outlet: the card shows a warning, the website's
  # texts are not used, and "Hide outlets whose website did not answer" hides it.
  taken_over:
    # most of the title / description is in a script that none of the outlet's languages uses
    # (scripts and their languages: name_scripts below), e.g. Thai text on a Ghanaian news site
    other_script_share: 0.5
    # betting and shop words in the title or description
    words: [slot gacor, situs slot, slot online, judi online, togel, sbobet, casino online, online casino,
            bandar, pragmatic play, แทงบอล, วิเคราะห์บอล, บาคาร่า, สล็อต, t shirts, kids t shirts, 博彩, 娱乐城,
            apuestas deportivas, casas de apuestas, sports betting tips, betting tips]

# ---------------------------------------------------------------- not news
# Pure sports, music/culture, children's and religious channels (owner, 13.11.2026): they stay in the
# data but are hidden by the checkbox "Only news media", which is ticked by default.
# An outlet counts when: its type is one of org_types, it is on TV or radio and not in print, ALL its
# topics (apart from ignore_topics and weak "Reports on it" mentions) are in "topics", and at least one
# of them comes from a source's own category (iptv-org category, Radio Browser tag, Wikidata class).
# A sports NEWSPAPER, a channel that also has a news topic or a politics section on its website, and
# members of the lists in not_networks (general broadcasters) are not affected.
not_news:
  org_types: [news_outlet]
  channels_any: [tv, radio]
  not_channels: [print]
  topics: [sports, culture, religion, children_youth]
  ignore_topics: [community_local]
  not_networks: [ebu_members, abu_members, asbu_members, cbu_members, state_media, sdg_media_compact]

# ---------------------------------------------------------------- not media
# Government websites and NGOs that a media list (Media Cloud) lists as "media" are not shown in the
# media list (owner, 13.11.2026); every one is listed in reports/not_media.md.
# TV and radio stations run by public bodies (e.g. state radio stations in Mexico) stay.
not_media:
  only_sources: [media_cloud]          # only entries known from these lists alone
  not_channels: [tv, radio]
  # the part of the web address that marks a government site (".gov", ".go.ke", ".gob.mx", ".gouv.fr" ...)
  government_host: '\.(gov|go|gob|gouv|gub|govt|mil|gv|government)(\.[a-z]{2,3})?$'
  # the website is also the website of an organisation on the "Organisations & NGOs" page
  ngo_website: true
  # the only website is a newspaper ARCHIVE: a historic paper that is no longer published
  archive_hosts: [chroniclingamerica.loc.gov, gallica.bnf.fr, hemerotecadigital.bne.es, digi.kansalliskirjasto.fi,
                  trove.nla.gov.au, delpher.nl, anno.onb.ac.at, newspapers.com, archive.org, europeana.eu,
                  paperspast.natlib.govt.nz, britishnewspaperarchive.co.uk, digitalcollections.nypl.org,
                  news.google.com, e-newspaperarchives.ch, digipress.digitale-sammlungen.de, zefys.staatsbibliothek-berlin.de]
  # academic journals that Wikidata lists as "magazine": words in the Wikidata description
  description_words: [scientific journal, academic journal, peer-reviewed journal, peer reviewed journal,
                      научный журнал, revue scientifique, revista científica, wissenschaftliche zeitschrift]

# ---------------------------------------------------------------- prominence ("Top 10 / Top 50")
# Rank within the country (review 13.11.2026). Base = Wikipedia language versions + number of sources.
# Then: news media before pure sports / music / children's / religious channels and before outlets
# with a special subject only (France Football, Billboard); and, so that the many outlets with the same
# base value do not stand in random order: points for a working website, recent articles, social media
# and a public contact.
prominence:
  not_news_factor: 0.25        # pure sports / music / children's / religious channels
  # special-interest outlets (France Football, Marie Claire, Disney Channel, Charlie Hebdo): no
  # "General news" among the topics AND a source itself names a special subject, or one of these classes
  special_interest_factor: 0.5
  special_interest_classes: [satirical newspaper, satirical magazine, "women's magazine", "children's interest channel",
                             sports magazine, sports newspaper, music magazine, fashion magazine, lifestyle magazine,
                             "men's magazine", celebrity magazine, video game magazine, automobile magazine]
  # Hand corrections of the number of Wikipedia language versions, where Wikidata links the outlet to
  # the wrong article: outlet id -> number. (Şalom, a Turkish weekly, was linked to the article about
  # the word "shalom" with 124 languages and stood second worldwide.)
  wikipedia_languages_fix:
    pf-000037: 12
  bonus:
    active: 2          # article in the last active_months
    website_ok: 1
    social_media: 1
    public_contact: 1

# Names in another script (review 13.11.2026: "ARD" was shown in Arabic): when the name has no Latin
# letter and none of the outlet's languages is written in that script, a name in Latin letters is used.
name_scripts:
  Arabic: [ara, fas, urd, pus, kur, ckb, uig, snd, prs]
  Cyrillic: [rus, ukr, bel, bul, srp, mkd, kaz, kir, tgk, mon, uzb, tat, bak, che, abk, oss, sah, tuk, aze]
  CJK: [zho, cmn, yue, jpn, kor, wuu, nan, hak]
  Hebrew: [heb, yid]
  Greek: [ell]
  Devanagari: [hin, mar, nep, mai, bho, san, kok]
  Thai: [tha]

# ---------------------------------------------------------------- website check
# Channels found on the outlet's own website (menu entries, feed addresses).
# Whole menu entry or a word in it; 9 UN News languages.
website_channels:
  podcast: [podcast, podcasts, balado, balados, pódcast, pódcasts, подкаст, подкасты, بودكاست, 播客, पॉडकास्ट, podikasti]
  newsletter: [newsletter, newsletters, infolettre, lettre d'information, boletín, boletim, рассылка, النشرة البريدية, न्यूज़लेटर, jarida la barua pepe]
# The page language (<html lang="fr">) is used when no source names a language.
website_language: true

# "Open to partner content" (UN profile; suggestion 1, owner's go 09.11.2026):
# the outlet's website shows it publishes content from others. Words in link texts /
# addresses on the website and in its About page. 9 UN News languages.
# NOT used (review 13.11.2026): "syndication", "republish", "Creative Commons" - they mean the outlet
# GIVES its content to others (Le Monde "Réutiliser nos contenus"), not that it takes content in;
# "partner with us" is mostly advertising.
open_to_partner_content:
  - submit a story
  - submit your story
  - submit news
  - submit an article
  - send us your story
  - send us your news
  - write for us
  - become a contributor
  - contributors wanted
  - pitch us
  - submit a press release
  - submit press release
  - content partnership
  - content partners
  - proposer un article
  - envoyez vos articles
  - envoyez-nous
  - devenir contributeur
  - publiez votre communiqué
  - envía tu nota
  - envíanos tu noticia
  - publica tu noticia
  - escribe para nosotros
  - colabora con nosotros
  - envie sua notícia
  - envie sua pauta
  - seja colaborador
  - colabore conosco
  - прислать новость
  - предложить новость
  - стать автором
  - أرسل خبرك
  - شارك بمقال
  - 投稿
  - अपनी खबर भेजें
  - tuma habari yako

# UN profiles found in how outlets describe themselves (point 8, 09.11.2026: no open
# member lists exist for these). "phrases" = in the name, description, Wikipedia
# introduction or About page; "sections" = a whole menu entry on the outlet's website.
un_profile_words:
  solutions:
    phrases: [solutions journalism, solutions-focused journalism, solutions-oriented journalism, constructive journalism,
              constructive news, solutions reporting, positive news, journalisme de solutions, journalisme constructif,
              journalisme d'impact, periodismo de soluciones, periodismo constructivo, jornalismo de soluções,
              jornalismo construtivo, конструктивная журналистика, صحافة الحلول, الصحافة البناءة, 建设性新闻,
              समाधान पत्रकारिता, uandishi wa suluhisho]
    # only clear names of the method: a menu entry "Good News" or "Solutions" alone is not
    # solutions journalism (review 13.11.2026: AP, local TV stations were matched)
    sections: [solutions journalism, solutions reporting, constructive journalism, journalisme de solutions,
               periodismo de soluciones, jornalismo de soluções]
  development:
    phrases: [development journalism, development reporting, global development, international development,
              development news, development issues, journalisme de développement, information pour le développement,
              periodismo para el desarrollo, periodismo de desarrollo, jornalismo de desenvolvimento,
              журналистика развития, الصحافة التنموية, صحافة التنمية, 发展新闻, विकास पत्रकारिता,
              uandishi wa habari za maendeleo]
    # "Development" alone as a menu entry is too vague (software, personal, real estate development)
    sections: [global development, international development, development news, sustainable development,
               développement durable, desarrollo sostenible, desenvolvimento sustentável, التنمية المستدامة,
               maendeleo endelevu]

# Only ORGANISATION e-mail addresses are SHOWN in the tool (owner 06.11.2026); personal ones (j.smith@,
# maria.lopez@) are not shown. The stored raw data (raw/) keeps ALL addresses (owner 11.11.2026: needed later).
# An address is kept when the part before "@" STARTS WITH one of these words, or CONTAINS one of the
# words in "contains".
org_email:
  starts: [info, contact, contacto, contato, kontakt, redac, redaction, redaccion, redacao, redazione, redaktion,
           newsroom, news, noticias, nouvelles, editor, editors, editorial, desk, hello, hola, bonjour, office,
           admin, press, presse, prensa, imprensa, mail, communication, comunicacion, comunicacao, media, secretariat,
           secretaria, secretariado, reception, support, webmaster, tips, letters, studio, programs, programmes,
           radio, tv, online, general, enquir, inquir, team, welcome, bureau, sede, accueil, feedback, informativos,
           ngo, hq, headquarter, central, membership, partnership, advocacy, program, service, servicio, servico,
           kontor, post, correo, courrier, jornal, journal, tele, direccion, direction, director, board]
  contains: [info, contact, redac, news, noticia, press, prensa, media, office, secretariat, radio, tv,
             editor, geneva, genev, newyork, ecosoc, global, intl, international, network]

# ---------------------------------------------------------------- automatic update
# The update that runs on its own (.github/workflows/update.yml; owner's rules of 06.11.2026).
automation:
  # Safety brake: the update is not published when more than this share disappears at once
  max_drop: 0.10            # of all outlets / of all organisations
  max_source_drop: 0.25     # of the outlets of one source ...
  min_source_size: 1000     # ... that had at least this many outlets
  # A website counts as DEAD when the website check ends with one of these errors (the address no
  # longer exists). Refused visits (HTTP 403 / 429), time-outs and certificate problems do not count:
  # many large outlets block robots.
  dead_errors: ["Name or service not known", "No address associated with hostname", "Connection refused"]
  # An outlet is not shown when its website was dead at this many checks in a row; it comes back
  # as soon as the website answers. Listed in reports/hidden_websites.md.
  hide_after_dead_checks: 3
  # An outlet that is no longer in any source is still shown at the first update without it
  # (with a note) and removed at this one.
  remove_after_missing_runs: 2

