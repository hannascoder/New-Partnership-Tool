# Radio Browser: which stations count as information media, and which tags
# give which topic / organisation type. Decision of 05.11.2026 (docs/KATEGORIEN.md):
# only stations with an information offer. Tags are typed freely by users,
# in many languages, so every tag is matched EXACTLY (lower case), never as a
# part of a word ("christmas music" must not count as "christian").
# The numbers are how often the tag appeared on 05.11.2026 (61,396 stations).

# A station is kept if it has at least ONE of these tags.
# Stations without any tag (19,911) are only kept if another source confirms them.
include_tags:
  # news / talk / information
  - news            # 3171
