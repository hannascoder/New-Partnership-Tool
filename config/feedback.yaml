# "Get feedback" page (owner 24.11.2026, plan: docs/FEEDBACK_PLAN.md).
# Edit freely. After a change run:  python pipeline/build/feedback_config.py   (writes site/data/feedback-config.json)

# Columns of the private Google Sheet (tab name below). The first row of the tab must contain exactly these
# names (see config/feedback_sheet_template.csv, import it into Google Sheets once).
sheet_tab: "Contacts"
columns: [name, type, country, place, language, topic, age_group, description, contact_name, contact_email,
          general_email, extra_emails, send_mode, group_code, website, notes]

# send_mode: who gets the mail (owner's choice per group)
send_modes:
  - {id: main, label: "Only the main contact"}
  - {id: general, label: "Only the general address"}
  - {id: all, label: "Main contact + all other addresses"}

types:
  - Model UN group
  - Student organisation
  - Youth organisation
  - School / teachers
  - University department
  - NGO / civil society
  - Media outlet
  - Other

age_groups: ["under 18", "18-25", "26-35", "36-50", "over 50", "mixed"]

# UN products to ask about (everything, owner 24.11.2026). Add your own lines.
products:
  - {id: un_news_today, label: "UN News Today (podcast)", kind: podcast}
  - {id: un_interviews, label: "UN Interviews (podcast)", kind: podcast}
  - {id: lid_is_on, label: "The Lid Is On (podcast)", kind: podcast}
  - {id: awake_at_night, label: "Awake at Night (podcast)", kind: podcast}
  - {id: video, label: "UN video", kind: video}
  - {id: article, label: "UN article / story", kind: article}
  - {id: graphic, label: "UN graphic / infographic", kind: graphic}
  - {id: other, label: "[name of the product]", kind: other}

response_days: 7          # time to answer (owner: one week)
reminder_after_days: 4

# Mail template (English; no signature; [gaps] are highlighted yellow).
#   {name} group  {product} chosen product  {link} survey link with group code  {deadline} date (today + response_days)
mail:
  subject: "5 minutes: your feedback on {product}"
  body: |
    Dear {name} team,

    We are developing {product} at the United Nations and would very much like to hear what you think. [One sentence: what it is and who it is for.]

    Could you take about [5-10] minutes to answer a short anonymous survey?
    {link}

    The survey is open until {deadline}. At the end you will find a box where you can also tell us how we could improve the survey itself, and a box for ideas on what we should make next.

    You are welcome to share the link with other members of your group. [Optional: we will send you a short summary of the results.]

    If you would rather not receive requests like this, just reply and we will take you off our list.

    Thank you very much for your time!

    Best regards,
reminder_subject: "Reminder: your feedback on {product} (open until {deadline})"
reminder_intro: "A short reminder: the survey below is still open until {deadline}. If you have already answered, thank you, and please ignore this mail.\n\n"
