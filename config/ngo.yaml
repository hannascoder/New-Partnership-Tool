# NGOs (phase 2, owner's decisions 10.11.2026)
# - NGOs are in the database but only shown when "Include NGOs in this search" is ticked.
# - Same filters as media (country, region, language, topics/SDGs, target audience, contact ...);
#   extra NGO filters fold out when the box is ticked.
# - Classic NGOs only for now (no foundations, universities, think tanks, companies).
# - ALL ECOSOC NGOs, also those only registered without consultative status (small note on the card,
#   filter "Only NGOs with ECOSOC status").
# - Far-right NGOs and government-organised NGOs (GONGOs) are not shown.
# - Shown together with media on the website, but in separate sections in the export.

# Own page "NGOs" (owner 12.11.2026): switch "Media | NGOs" at the top right, same layout, filters and export
# as the media page; the box "Include NGOs" on the media page was removed.
page_title: "Organisations & NGOs"
page_hint: "NGOs and other organisations from ECOSOC, the UN Global Compact, UN Geneva, Wikidata and IATI."
hide_registered_label: "Hide NGOs only registered in ECOSOC (not checked by the UN)"
hq_only_label: "Only NGOs based in this country (not those only active there)"
# "Geographic scope" from the ECOSOC "Activities" tab (first word of the value)
geo_scope:
  - {id: international, label: "International"}
  - {id: regional, label: "Regional"}
  - {id: national, label: "National"}
  - {id: local, label: "Local"}

# UN status / accreditation ("Member of" for NGOs). Order = strength for the ranking.
un_status:
  - {id: ecosoc_general, label: "ECOSOC General consultative status", weight: 6}
  - {id: ecosoc_special, label: "ECOSOC Special consultative status", weight: 5}
  - {id: ecosoc_roster, label: "ECOSOC Roster status", weight: 4}
  - {id: dgc_associated, label: "Associated with UN DGC", weight: 4}
  - {id: un_geneva, label: "Accredited at UN Geneva", weight: 3}
  - {id: desa_cosp, label: "Accredited to the Disability Conference (COSP)", weight: 3}
  - {id: ecosoc_registered, label: "Registered in the ECOSOC database (no status)", weight: 1,
     note: "Only registered in the UN civil society database: not checked by the UN."}
  - {id: iati_publisher, label: "Publishes its projects (IATI)", weight: 2}
  - {id: un_global_compact, label: "UN Global Compact participant", weight: 5}
all_status_label: "Must have all chosen statuses (e.g. ECOSOC and Global Compact)"

# "Existing UN partner" (owner 13.11.2026): badge on the card, filter, export column; explained on the page.
# "Associated with UN DGC" is left out for now (no list yet).
un_partner:
  statuses: [ecosoc_general, ecosoc_special, ecosoc_roster, un_global_compact, un_geneva]
  label: "Existing UN partner"
  filter_label: "Only existing UN partners"
  explanation: "Existing UN partner = has ECOSOC consultative status (General, Special or Roster), takes part in the UN Global Compact, or is accredited at the UN in Geneva. Only being registered in the ECOSOC database or publishing projects in IATI does not count."

# Organisation type (owner 13.11.2026: page "Organisations & NGOs"; filter to show only NGOs or other types)
org_kind:
  - {id: ngo, label: "NGO"}
  - {id: foundation, label: "Foundation"}
  - {id: academic, label: "University / academic"}
  - {id: city, label: "City / local government"}
  - {id: labour, label: "Labour organisation"}
  - {id: business_association, label: "Business association"}

only_ecosoc_label: "Only NGOs with ECOSOC consultative status"

# Type of work: from the ECOSOC fields of activity, else from words in the name (descriptions name too much).
# A soft guess, shown as such on the card ("from the name / description").
type_of_work:
  - id: advocacy
    label: "Advocacy & rights"
    fields: [human rights, minority rights, torture, women/gender equality, human rights of women, advocacy and outreach]
    words: [advocacy, rights, droits, derechos, direitos, watch, campaign, justice, liberties, defenders]
  - id: humanitarian
    label: "Humanitarian aid & service delivery"
    fields: [humanitarian affairs, refugees, service provision, de-mining]
    words: [relief, humanitarian, aid, emergency, rescue, secours, ayuda, socorro, charity, charitable, caritas, red cross, red crescent, croix-rouge, cruz roja, food bank]
  - id: development
    label: "Development"
    fields: [development, sustainable development, extreme poverty, least developed countries, rural development, micro-credit]
    words: [development, développement, desarrollo, desenvolvimento, poverty, pauvreté, pobreza, empowerment]
  - id: research
    label: "Research & policy"
    fields: [research, policy advice, statistics]
    words: [research, institute, institut, instituto, studies, centre for, center for, policy, observatory, observatoire, observatorio]
  - id: network
    label: "Network / umbrella organisation"
    fields: []
    words: [network, réseau, red de, rede, federation, fédération, federación, alliance, alianza, coalition, coalición, union of, platform, plateforme, plataforma, council, conseil, confederation, international association, world association]
  - id: grassroots
    label: "Grassroots & community"
    fields: [volunteerism]
    words: [community, communauté, comunidad, comunidade, grassroots, village, local, association locale, self-help, cooperative]
  - id: youth
    label: "Youth organisation"
    fields: [youth]
    words: [youth, young, jeunes, jeunesse, juventud, jóvenes, juventude, jovens, student, students, étudiants, estudiantes, scouts, guides]
  - id: women
    label: "Women's organisation"
    fields: [women, women/gender equality, gender issues and advancement of women]
    words: [women, woman, women's, femmes, femme, mujeres, mujer, mulheres, mulher, girls, filles, niñas, sisters, sisterhood, feminist, féministe, feminista]
  - id: faith_based
    label: "Faith-based"
    fields: [religion]
    words: [church, christian, catholic, evangelical, lutheran, methodist, baptist, adventist, islamic, muslim, jewish, buddhist, hindu, sikh, bahá'í, baha'i, quaker, faith, église, chrétien, iglesia, cristiana, islámica, igreja, diocese, ministries, mission]

# Wikidata: its "NGO" class has far too many sub-classes (college sports teams, dioceses, convents,
# fire brigades ...: 67,000 items, checked 10.11.2026). An item from Wikidata alone counts as an NGO
# only when it is directly an instance of one of these classes; other Wikidata items are only used to
# add details (website, social media, languages) to NGOs found in ECOSOC, UN Geneva or IATI.
wikidata_classes_included: [non-governmental organization, international non-governmental organization,
  environmental non-governmental organization, non-governmental organization for development,
  advocacy group, activist group, civil society organization, Civil Society Organization of Public Interest,
  charitable organization, charitable corporation, charitable trust, charitable incorporated organisation, health charity,
  aid agency, humanitarian organization, development organization, volunteer organization,
  human rights organization, Helsinki Committee for Human Rights, women's organization, women's rights organization,
  LGBTQ+ organization, LGBTQ+ rights organization, disability rights organization, disabled people's organisation,
  indigenous rights organization, anti-racism organization, peace organization, anti-nuclear organization,
  environmental organization, conservation organization, animal welfare organization, animal rights organization,
  animal advocacy organization]

# ECOSOC fields of activity -> target audience (config/categories.yaml audience ids)
audience_from_fields:
  children: children
  the girl child: children
  youth: youth_students
  aging: older_persons
  disabled persons: persons_with_disabilities
  indigenous peoples: indigenous
  indigenous issues: indigenous
  women: women
  women/gender equality: women
  migration: diaspora_migrants
  refugees: diaspora_migrants
  minority rights: ethnic_minorities
  agriculture: rural_farmers
  rural development: rural_farmers
  religion: religious

# Not shown (owner 10.11.2026: "ja auch raus"):
exclude:
  # Wikidata classes of the item (instance of): government-organised NGOs
  wikidata_classes: [government-organized non-governmental organization, GONGO, state-sponsored organization]
  # not classic NGOs although Wikidata also lists them under an NGO class (10.11.2026: German "pressure group"
  # = mostly business associations): left out when any source item has one of these classes
  wikidata_not_ngo_classes: [trade association, professional association, employers' organization, business association,
                             chamber of commerce, trade union, political party, sports governing body, medical association,
                             learned society, scientific society, think tank, university, foundation]
  # 11.11.2026 sample check: schools, hospitals, clubs ... that Wikidata also calls "charitable organization" or
  # "NGO": left out when any Wikidata class CONTAINS one of these words
  wikidata_not_ngo_class_words: [school, college, hospital, museum, club, monastery, abbey, parish, convent,
                                 political faction, sports team, kindergarten]
  # ... except these classes (service clubs like Rotary, Lions, Zonta, Kiwanis are classic partner NGOs)
  wikidata_class_words_keep: [service club]
  # right-wing NGOs (owner 10.11.2026: "alles raus was rechts ist"; mainstream conservative stays, like for media):
  # Wikidata political ideology, in addition to the far-right list of config/rules.yaml
  wikidata_ideologies_right: [right-wing populism, national conservatism, ultraconservatism, paleoconservatism, Christian right,
                              ethnic nationalism, white nationalism, Identitarian movement, opposition to immigration, Islamophobia,
                              anti-gender movement, anti-transgender activism, anti-feminism, homophobia, racism, anti-abortion movement,
                              Russian nationalism]
  # checked by hand (Wikidata has no fitting ideology); name exactly as in the sources + public evidence
  manual:
    - {name: "Federation for American Immigration Reform", reason: "right-wing (anti-immigration group; English Wikipedia; listed as a hate group by the Southern Poverty Law Center)"}
  # same far-right ideologies as for media: config/rules.yaml exclude_far_right.wikidata_ideologies
  # words in the name that show it is not a classic NGO (companies, government bodies, universities)
  name_words: [ministry of, ministère, ministerio, government of, university, université, universidad, universidade,
               city council, municipality, chamber of commerce, chambre de commerce, cámara de comercio,
               automobile club, automobile federation, automobile association]

# Ranking within a country (size filter "Top 10 / Top 50"): UN status weight (highest), then the
# number of Wikipedia language versions, then the number of sources.

# Topic strength (review 13.11.2026): an organisation whose ECOSOC fields of activity lead to this many
# topics or more ticked "everything"; a field alone then only counts as "Reports on it" (not "Has a
# section on it"). "Specialist" always needs the topic in the name or 2 clear words in its own description.
many_fields: 10
