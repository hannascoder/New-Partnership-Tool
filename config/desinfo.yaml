# (key added 17.11.2026)
# Disinformation & fake news monitor (page site/desinfo.html). All settings live here, not in code.
# Plan: docs/DESINFO_PLAN.md. Everything free and open; the only key is the free Google Fact Check key
# (GitHub secret GOOGLE_FACTCHECK_API_KEY); without it the run still works with the other sources.

atlas_base: https://raw.githubusercontent.com/hannascoder/UN-Media-Consumption-Map-copy-2/main/data
atlas_files: [topics.json, trends/country_searches.json]   # public Atlas data, copied at every run

google_factcheck:
  endpoint: https://factchecktools.googleapis.com/v1alpha1/claims:search
  max_age_days: 14          # each daily run asks for the last 14 days (overlap = safe against missed runs)
  backfill_age_days: 365    # the one-off "Backfill" run (workflow input) asks for the last 12 months
  page_size: 100
  max_pages: 1              # pages per query in a daily run
  backfill_max_pages: 3     # pages per query in the backfill run
  max_requests: 2600        # safety limit per run (the free quota is far higher)
  pause_seconds: 0.2
  # topic titles are searched in English and in these languages (title of the topic in that language)
  topic_languages: [en, fr, es, ar, pt, ru, zh, hi, sw]
  # the other Atlas languages are searched in turns: this many of them per day (every language every ~5 days)
  rotating_languages: [bn, id, ha, am, ur, fa, tr, vi, th, ja, de, uk, ko]
  rotating_per_day: 3
  un_queries: ["United Nations", "UN", "UNICEF", "WHO", "UNHCR", "Guterres", "peacekeepers", "UNESCO", "UNDP", "WFP"]

discovery:                  # automatic search for fact-checkers and their feeds (pipeline/fetch/desinfo_discover.py)
  wikidata_class_labels: ["fact-checking organization", "fact-checking website", "fact-checker", "fact-checking"]
  discover_max_sites: 250   # sites looked at per weekly run (the rest follows in the next runs)
  # second source of candidates: every web site that Google names as publisher of a fact-check (grows by itself)
  google_min_items: 2       # at least this many fact-checks from the site in our archive
  skip_domains: [facebook.com, twitter.com, x.com, youtube.com, instagram.com, tiktok.com, t.me, wikipedia.org, google.com]
  # A feed found for a site that is not a known fact-checker only counts when most of its items look like fact-checks:
  cue_min_ratio: 0.5
  cue_words: [fact, check, verif, verific, falso, falsa, "false", faux, fausse, fake, hoax, bulo, boato, desmentid, démenti,
              rumor, rumour, mislead, engañ, enganos, myth, mito, mythe, intox, "is it true", "es cierto", "é verdade",
              "est-ce vrai", "no es", "não é", "não, ", "no, ", "non, ", "نفي", "فيديو", "ادعاء", "تحقق", "ложь", "фейк", "проверка",
              "假", "辟谣", "核查", "झूठ", "फर्जी", "uongo", "feki"]

gap:                        # traffic light of the "Content gaps" view (owner's rule, 17.11.2026)
  red_min_factchecks: 5     # red: at least this many fact-checks in the window ...
  red_max_un: 1             # ... and at most this many UN articles in the last 12 months
  yellow_min_factchecks: 2  # yellow: at least this many fact-checks and at most yellow_max_un UN articles
  yellow_max_un: 5          # green: more UN articles than that

translation:                # automatic English translation of fact-check titles (open source: Argos Translate)
  max_per_run: 1500         # titles translated per daily run (the rest follows the next day)
  budget_seconds: 900       # the translation stops by itself after this time (the rest follows in the next run)
  max_title_chars: 200
  skip_languages: [en]

keep_days: 365              # single items older than this are deleted; the daily counts are kept for good
red_marker:                 # "strongly rising" topic (owner 17.11.2026)
  factor: 2.0               # more than 2x the average of the weeks before ...
  baseline_days: 28
  min_items: 5              # ... and at least this many items in the last 7 days

# Words that mark an item as "UN-related". Acronyms are matched as whole words, case-sensitive.
un_acronyms: [UN, UNICEF, WHO, UNHCR, UNDP, UNESCO, FAO, WFP, UNFPA, UNEP, ILO, IOM, OCHA, ONU, OMS, OHCHR, IPCC, UNRWA, MONUSCO, UNIFIL, UNMISS, MINUSMA]
un_names: ["United Nations", "Naciones Unidas", "Nations Unies", "Nações Unidas", "Vereinte Nationen",
           "Организация Объединённых Наций", "Организации Объединенных Наций", "ООН", "联合国", "聯合國",
           "الأمم المتحدة", "संयुक्त राष्ट्र", "Umoja wa Mataifa", "World Health Organization",
           "Organisation mondiale de la santé", "Organización Mundial de la Salud", "Guterres",
           "Secretary-General", "blue helmets", "Blue Helmets", "peacekeepers", "casques bleus", "cascos azules"]

# "Country the fact-check is about": country names found in the headline / claim (English names + aliases come from
# config/countries.csv). Names that are also ordinary words or places elsewhere are skipped; local spellings added here.
about_skip_names: [georgia, jordan, chad, turkey leg]
about_aliases:          # ISO2: other names (Spanish, French, Portuguese, German, local); whole words, accents ignored
  US: [Estados Unidos, Etats-Unis, États-Unis, Vereinigte Staaten, Amerika, "U.S."]
