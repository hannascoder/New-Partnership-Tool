# Link to the Partner Finder (owner 17.11.2026): for a chosen country the page lists local voices that are already in the
# Partner Finder data: fact-checkers, community media, well-known news outlets, and organisations / NGOs.
partners:
  top_n: 6                  # entries shown per group (the link opens the full list in the Partner Finder)
