# ============================================================================
# Target audience words (owner's to-do 7, 09.11.2026). Same format and rules as
# config/topic_keywords.yaml, but only matched on the outlet's NAME, DESCRIPTION
# and the Wikipedia / website About text (not on headlines: a headline says what
# is reported, not who it is made for). So the words describe WHO the outlet is
# for ("radio des femmes", "for young people"), not a topic.
# Ids = the target audience ids in config/categories.yaml (audience:).
# ============================================================================
