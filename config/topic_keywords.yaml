# ============================================================================
# Topic keyword lists (owner's decision 09.11.2026, plan T1).
# NOT shown on the website. The pipeline (pipeline/classify/topic_text.py)
# compares them with what is known about each outlet / NGO:
#   name, Wikidata description, Wikipedia introduction (raw/texts/),
#   website: title, description, menu / section names, headlines, About page
#   (raw/website_check/).
#
# Three strengths (agreed 09.11.2026):
#   FOCUS  the topic is the outlet's main subject: a "strong" word in its name
#          or description, or 2+ strong words (or strong + context) in its
#          Wikipedia introduction / About page, or a source / network says so
#   DESK   the website has its own section for it: a "sections" word (or a
#          strong word) is a menu entry
#   COVERS the topic appears repeatedly: 2+ strong words in the headlines /
#          home page, or 1 strong word in the Wikipedia introduction / About page
#   One single word somewhere does not count.
#
# Per topic:
#   sections   menu / section names (-> DESK); also matched in the address, e.g. /climate/
#   context    words that only count together with a strong word
#   exclude    expressions in which a word means something else; removed
#              from the text before matching (they apply to all topics)
#   subtopics  plain-language sub-topics (orientation: the official SDG
#              targets, see "targets"); each has its own "strong" words.
#              Selecting a topic on the website includes all its sub-topics;
#              the user can untick some to be more specific.
#   general_subtopic  the sub-topic that a general match counts for (e.g. a
#              "Climate" section or a source category without more detail)
#   strong     (topics without sub-topics) words that count on their own
#
# Languages: the 9 UN News languages (en fr es pt ar ru zh hi sw).
# Matching ignores upper/lower case and accents, whole words only;
# a word ending in * also matches longer words (femini* = feminism, feminist ...).
# Chinese has no spaces: Chinese words are matched anywhere in the text.
# To add a word: put it in the right list. Run check_config.py afterwards.
# ============================================================================

