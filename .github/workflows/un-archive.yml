# One-off: reads old copies of the UN feeds from the Internet Archive (Wayback Machine) so the content-gap check has a deeper UN archive.
# Start by hand: Actions -> "UN archive backfill" -> Run workflow. Free; about 30-60 minutes. Result: raw/un_archive/.
name: UN archive backfill
on:
  workflow_dispatch:
  push:
    branches: ["claude/quirky-albattani-um2yqd"]
    paths: ["pipeline/fetch/un_archive.py", ".github/workflows/un-archive.yml"]
permissions:
  contents: write
concurrency:
  group: un-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Read the old copies
        run: cd pipeline/fetch && python un_archive.py
      - name: Save
        run: |
          git config user.name "partner-finder-bot"
          git config user.email "partner-finder-bot@users.noreply.github.com"
          if [ -e raw/un_archive ]; then git add raw/un_archive; fi
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "UN archive backfill $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
